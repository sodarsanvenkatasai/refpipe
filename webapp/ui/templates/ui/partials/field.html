{% load ui_extras %}
<div class="field {% if field.errors %}field-invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}
</div>
